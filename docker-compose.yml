version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Проброс папки src для live-reload при локальной разработке
      - ./backend/src:/app/src
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_frontend
    ports:
      - "5173:5173"
    volumes:
      # Проброс исходников фронтенда для горячей перезагрузки (HMR)
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # Изолируем контейнерные node_modules от хоста
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: always